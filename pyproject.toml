[project]
name = "invoice-pdf-to-excel"
version = "0.1.0"
description = "Extract, validate and consolidate Spanish PDF invoices into Excel reports for accountants."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The invoice-pdf-to-excel authors" }]
keywords = ["invoices", "pdf", "excel", "ocr", "spain", "iva", "modelo-303", "modelo-347"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "watchdog>=4",
]

[project.optional-dependencies]
ocr = ["pillow>=10", "pypdfium2>=4.30", "pytesseract>=0.3.10"]
llm = ["anthropic>=0.40"]
web = ["fastapi>=0.111", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/ldiazcuadrado/invoice-pdf-to-excel"
Repository = "https://github.com/ldiazcuadrado/invoice-pdf-to-excel"
Issues = "https://github.com/ldiazcuadrado/invoice-pdf-to-excel/issues"

[project.scripts]
invoice-to-excel = "invoice_to_excel.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.5",
    "types-openpyxl",
    "types-reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_to_excel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=invoice_to_excel --cov-report=term-missing --cov-fail-under=85"
markers = ["ocr: requires the Tesseract binary"]

[tool.coverage.run]
branch = true
omit = ["src/invoice_to_excel/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["T201", "N806"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pypdfium2", "pytesseract", "pytesseract.*"]
ignore_missing_imports = true
